name: smoke_a5
seed: 0
device: auto
output_dir: runs

task:
  name: a5
  group:
    group: A5
    train_min_len: 3
    train_max_len: 8
    eval_lengths: [8, 16]

model:
  d_model: 64
  n_layers: 1
  n_slots: 2
  slot_dim: 32
  block_size: 8
  state_type: block_diagonal
  transition_norm: softmax
  transition_temperature: 0.5
  transition_chunk_size: 32
  gate_mode: constant
  constant_gate: 1.0
  initial_state: learned
  token_conv_kernel: 1
  readout: linear
  readout_hidden: 32
  readout_rank: 8

train:
  steps: 200
  batch_size: 32
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 20
  schedule: cosine
  log_every: 20
  eval_every: 50
  eval_batches: 4
  eval_batch_size: 32
  save_checkpoint: true
