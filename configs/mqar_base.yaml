name: mqar
seed: 0
device: auto
output_dir: runs

task:
  name: mqar
  mqar:
    n_keys: 64
    n_values: 64
    n_pairs: 16
    n_queries: 16
    n_distractors: 16
    eval_pairs: [8, 16, 32, 64]
    eval_distractors: [16, 64]

# Base is the diagonal state type.  A sweep over state_type reuses block_size 4
# for the block-dense and cascade variants; the diagonal config normalises it to
# 1 automatically.
model:
  d_model: 128
  n_layers: 2
  n_slots: 4
  slot_dim: 32
  block_size: 4
  state_type: diagonal
  transition_norm: softmax
  transition_chunk_size: 64
  token_conv_kernel: 4
  readout: gated_linear
  readout_hidden: 64
  readout_rank: 8
  attention_temperature: 1.0

train:
  steps: 20000
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 200
  schedule: cosine
  log_every: 100
  eval_every: 500
  eval_batches: 8
  eval_batch_size: 64
  save_checkpoint: true
