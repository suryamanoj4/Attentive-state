name: smoke_mqar
seed: 0
device: auto
output_dir: runs

task:
  name: mqar
  mqar:
    n_keys: 16
    n_values: 16
    n_pairs: 4
    n_queries: 4
    n_distractors: 2
    eval_pairs: [4, 8]
    eval_distractors: [2]

model:
  d_model: 64
  n_layers: 1
  n_slots: 2
  slot_dim: 32
  block_size: 4
  state_type: block_diagonal
  transition_norm: softmax
  transition_chunk_size: 32
  token_conv_kernel: 3
  readout: attention
  readout_hidden: 32
  readout_rank: 8
  attention_temperature: 1.0

train:
  steps: 200
  batch_size: 32
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 20
  schedule: cosine
  log_every: 20
  eval_every: 50
  eval_batches: 4
  eval_batch_size: 32
  save_checkpoint: true
