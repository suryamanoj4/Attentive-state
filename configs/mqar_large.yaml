name: mqar_large
seed: 0
device: auto
output_dir: runs

task:
  name: mqar
  mqar:
    n_keys: 64
    n_values: 64
    n_pairs: 16
    n_queries: 16
    n_distractors: 16
    eval_pairs: [8, 16, 32, 64]
    eval_distractors: [16, 64]

# Paper-scale MQAR.  The base config is the fast iteration model; this one is
# for the 4-GPU node.  Sweep state_type/readout as usual.
model:
  d_model: 384
  n_layers: 2
  n_slots: 8
  slot_dim: 32
  block_size: 4
  state_type: diagonal
  transition_norm: softmax
  transition_chunk_size: 32
  token_conv_kernel: 4
  readout: gated_linear
  readout_hidden: 64
  readout_rank: 16
  attention_temperature: 1.0

train:
  steps: 20000
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 500
  schedule: cosine
  log_every: 100
  eval_every: 1000
  eval_batches: 4
  eval_batch_size: 64
  save_checkpoint: true
