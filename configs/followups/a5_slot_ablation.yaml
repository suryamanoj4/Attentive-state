name: a5_slots
seed: 0
device: auto
output_dir: runs

# H4 follow-up: keep total state size at 128 while varying the number of slots.
# Run separate sweeps with:
#   n_slots=1 slot_dim=128
#   n_slots=2 slot_dim=64
#   n_slots=4 slot_dim=32
#   n_slots=8 slot_dim=16
# and readouts attention, slot_gated, slot_max, gated_linear, linear.
# The global linear/gated readouts are the "attention is unnecessary" controls;
# the slot readouts test input-only or hard slot selection without attention.
task:
  name: a5
  group:
    group: A5
    train_min_len: 3
    train_max_len: 20
    eval_lengths: [20, 40, 80, 160, 320, 640, 1280, 2560, 5120]

model:
  d_model: 128
  n_layers: 1
  n_slots: 4
  slot_dim: 32
  block_size: 8
  state_type: block_diagonal
  transition_norm: softmax
  transition_temperature: 0.5
  transition_chunk_size: 64
  gate_mode: constant
  constant_gate: 1.0
  initial_state: learned
  token_conv_kernel: 1
  readout: attention
  readout_hidden: 64
  readout_rank: 8

train:
  steps: 50000
  batch_size: 128
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 200
  schedule: cosine
  log_every: 1000
  eval_every: 2500
  eval_batches: 4
  eval_batch_size: 16
  save_checkpoint: true
