name: copy
seed: 0
device: auto
output_dir: runs

task:
  name: copy
  copy:
    content_vocab: 16
    train_min_len: 8
    train_max_len: 32
    eval_lengths: [16, 32, 64, 128, 256, 512]

model:
  d_model: 128
  n_layers: 2
  n_slots: 4
  slot_dim: 32
  block_size: 4
  state_type: block_diagonal
  transition_norm: softmax
  transition_chunk_size: 64
  token_conv_kernel: 1
  readout: attention
  readout_hidden: 64
  readout_rank: 8

train:
  steps: 10000
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 200
  schedule: cosine
  log_every: 100
  eval_every: 500
  eval_batches: 8
  eval_batch_size: 64
  save_checkpoint: true
